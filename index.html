    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f2ede0; }
      :root { --focus-light: #fff2d4; --focus-dark: #2a201b; }
      /* Dialogs and reading panels can receive focus to announce their content. */
      body :where([tabindex="-1"], dialog):focus,
      body :focus:not(:focus-visible) { outline: none; }
      /* Show the two-tone ring on controls used with a keyboard or controller. */
      body :is(button, a[href], input, select, textarea, summary, [contenteditable="true"], [tabindex]:not([tabindex="-1"])):is(:focus-visible, [data-controller-focus] :focus) {
        outline: 2px solid var(--focus-light);
        outline-offset: 2px;
        box-shadow: 0 0 0 2px var(--focus-dark);
      }
      @media (forced-colors: active) {
        :root { --focus-light: Highlight; --focus-dark: transparent; }
      }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
